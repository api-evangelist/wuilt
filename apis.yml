aid: wuilt
name: Wuilt
description: >-
  Wuilt is an Egypt-based, Arabic-first no-code website and online-store builder that
  lets individuals and small businesses create a website, e-commerce storefront, or
  landing page in a few steps without prior design or development experience. The
  platform bundles hosting, domains, templates, a store/checkout with shipping, forms,
  multilingual sites, and a chat widget. Wuilt operates a public GraphQL backend at
  api.wuilt.com/graphql (introspection enabled) that powers its builder app, exposing
  read operations across sites, sections, pages, menus, forms, plans, payments, and
  domains. Wuilt is a portfolio company of 500 Global.
